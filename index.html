<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LE MAÎTRE EN THÉ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>LE MAÎTRE EN THÉ</title>

  <style>
    :root{
      --ink:#080807;
      --paper:#11100e;
      --panel:#0d0c0b;
      --cream:#f1e7d2;
      --gold:#c6a15a;
      --gold2:#e4ca8b;
      --gold3:#80632f;
      --line:#6d552d;
      --muted:#b9ab91;
      --soft:#1a1712;
      --shadow:0 14px 34px rgba(0,0,0,.42)
    }

    *{box-sizing:border-box}

    html{background:#050505}

    body{
      margin:0;
      background:radial-gradient(circle at 50% 0,#1a1712 0,#080807 38%,#050505 100%);
      color:var(--cream);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",YuGothic,sans-serif;
      min-height:100vh
    }

    .hero{
      min-height:300px;
      background:#0b0a09 center 44%/cover no-repeat;
      color:#fff;
      position:relative;
      border-bottom:1px solid var(--gold3);
      overflow:hidden
    }

    .hero:before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(0,0,0,.10),
        rgba(0,0,0,.18) 42%,
        rgba(0,0,0,.93) 100%
      )
    }

    .hero:after{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      bottom:12px;
      height:14px;
      border-top:1px solid var(--gold);
      border-bottom:1px solid rgba(198,161,90,.35);
      opacity:.9
    }

    .hero-inner{
      position:relative;
      z-index:1;
      max-width:1180px;
      margin:auto;
      padding:150px 22px 34px;
      display:flex;
      align-items:flex-end;
      gap:16px;
      min-height:300px
    }

    .brand-logo{
      width:70px;
      height:70px;
      object-fit:contain;
      display:none;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))
    }

    .eyebrow{
      font-family:Georgia,"Times New Roman",serif;
      font-size:11px;
      letter-spacing:.28em;
      color:var(--gold2);
      text-transform:uppercase
    }

    .hero h1{
      margin:7px 0 0;
      font:600 34px/1.05 Georgia,"Times New Roman",serif;
      letter-spacing:.06em;
      color:#f6e8c4;
      text-shadow:0 3px 14px rgba(0,0,0,.65)
    }

    .subtitle{
      margin-top:9px;
      font-size:12px;
      letter-spacing:.04em;
      color:#ddd0b8
    }

    .wrap{
      max-width:1180px;
      margin:auto
    }

    .filters{
      background:linear-gradient(
        180deg,
        rgba(12,11,9,.985),
        rgba(8,8,7,.985)
      );
      padding:18px 18px 20px;
      position:sticky;
      top:0;
      z-index:5;
      border-bottom:1px solid var(--gold3);
      box-shadow:0 8px 24px rgba(0,0,0,.34);
      backdrop-filter:blur(10px)
    }

    .toprow{
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px
    }

    .search{
      width:100%;
      padding:14px 16px;
      border:1px solid var(--gold);
      border-radius:9px;
      background:linear-gradient(180deg,#f7efdd,#e9dcc0);
      color:#17120b;
      font-size:14px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)
    }

    .search::placeholder{
      color:#76694f
    }

    .reset{
      border:1px solid var(--gold3);
      color:var(--gold2);
      background:#15120e;
      border-radius:9px;
      padding:0 14px;
      cursor:pointer
    }

    .selects{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin-top:10px
    }

    select{
      width:100%;
      padding:11px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#14120f;
      color:var(--cream)
    }

    .section{
      margin-top:15px
    }

    .section-title{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:13px;
      font-weight:700;
      color:var(--gold2);
      letter-spacing:.04em
    }

    .section-title:after{
      content:"";
      height:1px;
      background:linear-gradient(90deg,var(--gold3),transparent);
      flex:1
    }

    .hint{
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      font-weight:400;
      color:#8e826e;
      font-size:10px
    }

    .chips{
      display:flex;
      gap:7px;
      flex-wrap:wrap
    }

    .chip{
      appearance:none;
      border:1px solid var(--line);
      background:#11100e;
      color:#d8cbb4;
      border-radius:6px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(198,161,90,.06)
    }

    .chip.on{
      background:linear-gradient(180deg,#2a2114,#17120d);
      color:#ffe8ad;
      border-color:var(--gold)
    }

    .chip.detail.on{
      background:#3b2d16;
      border-color:var(--gold2);
      color:#ffe8ad
    }

    .feature-chips{
      display:flex;
      gap:7px;
      flex-wrap:wrap
    }

    .feature-chip{
      cursor:pointer
    }

    .feature-chip input{
      position:absolute;
      opacity:0;
      pointer-events:none
    }

    .feature-chip span{
      display:block;
      border:1px solid var(--line);
      background:#11100e;
      color:#d8cbb4;
      border-radius:6px;
      padding:8px 10px;
      font-size:12px;
      box-shadow:inset 0 0 0 1px rgba(198,161,90,.06)
    }

    .feature-chip input:checked + span{
      background:linear-gradient(180deg,#2a2114,#17120d);
      color:#ffe8ad;
      border-color:var(--gold)
    }

    .checks{
      display:flex;
      gap:9px;
      margin-top:14px;
      flex-wrap:wrap;
      padding-top:12px;
      border-top:1px solid #31271a
    }

    .checks label{
      font-size:11px;
      display:flex;
      align-items:center;
      gap:5px;
      border:1px solid #4f3c20;
      border-radius:6px;
      padding:7px 9px;
      background:#0f0e0c;
      color:#d6c8ae
    }

    .checks input{
      accent-color:var(--gold)
    }

    .meta-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-top:12px;
      color:var(--muted);
      font-size:11px
    }

    .active{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-align:right
    }

    .status{
      max-width:1180px;
      margin:0 auto;
      padding:12px 18px 0;
      color:#8f826e;
      font-size:11px
    }

    .status.error{
      color:#d58174
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:15px;
      padding:18px
    }

    .card{
      background:linear-gradient(180deg,#13110e,#0d0c0a);
      border:1px solid var(--gold3);
      border-radius:10px;
      overflow:hidden;
      box-shadow:var(--shadow);
      position:relative
    }

    .card:before{
      content:"";
      position:absolute;
      inset:6px;
      border:1px solid rgba(198,161,90,.18);
      pointer-events:none;
      border-radius:6px
    }

    .visuals{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#090908;
      min-height:0;
      border-bottom:1px solid #3f301a
    }

    .visuals.one{
      grid-template-columns:1fr
    }

    .visuals:empty{
      display:none
    }

    .tea-img{
      width:100%;
      aspect-ratio:16/7;
      object-fit:cover;
      display:block;
      background:#0b0b0a
    }

    .body{
      padding:16px 16px 18px;
      position:relative;
      z-index:1
    }

    .ref{
      display:inline-block;
      color:#f0d18e;
      font-family:Georgia,"Times New Roman",serif;
      font-weight:700;
      font-size:12px;
      border:1px solid #745b2c;
      padding:3px 6px;
      border-radius:4px;
      margin-right:5px
    }

    .name{
      font:700 19px/1.25 Georgia,"Times New Roman",serif;
      color:#f4dfad
    }

    .tags{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
      margin:10px 0
    }

    .sales-format-icons{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
      margin:9px 0 0
    }

    .sales-format-icon{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      border:1px solid #4d3c23;
      border-radius:5px;
      background:#14110d
    }

    .name-ja{
      margin:5px 0 0;
      font-size:12px;
      line-height:1.45;
      letter-spacing:.03em;
      color:#b9ab91
    }
    
    .tag{
      background:#18140f;
      border:1px solid #4d3c23;
      border-radius:5px;
      padding:4px 7px;
      font-size:10px;
      color:#d9cdb5
    }

    .sales-badges{display:flex;gap:5px;margin:5px 0 8px;flex-wrap:wrap}
    .sales-badge{font-size:10px;color:#b9ab91;border:1px solid #4d3c23;border-radius:4px;padding:2px 5px}
    .sales-migration-notice{font-size:11px;color:#b9ab91;margin:6px 0 0}

    .tag.detail{
      background:#2c2213;
      border-color:#73592d;
      color:#efd59b
    }

    .desc{
      font-size:12px;
      line-height:1.75;
      white-space:pre-line;
      color:#d2c6b1
    }

    .facts{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:12px
    }

    .fact{
      font-size:10px;
      border:1px solid #6b522a;
      border-radius:4px;
      padding:4px 6px;
      color:#e1c98d;
      background:#15110c
    }

    .empty{
      grid-column:1/-1;
      padding:58px 20px;
      text-align:center;
      color:#8f826e
    }

      @media(max-width:700px){
        .hero{
          height:clamp(230px,31svh,270px);
          min-height:230px;
          background-position:center 24px
        }

      .hero:before{
        background:linear-gradient(
          180deg,
          rgba(0,0,0,.06),
          rgba(0,0,0,.12) 42%,
          rgba(0,0,0,.9) 100%
        )
      }

      .hero:after{
        left:max(12px,env(safe-area-inset-left));
        right:max(12px,env(safe-area-inset-right));
        bottom:9px;
        height:10px
      }

      .hero-inner{
        height:100%;
        min-height:0;
        padding:
          calc(env(safe-area-inset-top) + 14px)
          max(18px,env(safe-area-inset-right))
          27px
          max(18px,env(safe-area-inset-left));
        align-items:flex-end;
        justify-content:center;
        text-align:center
      }

      .hero-inner>div{
        width:100%
      }

      .eyebrow{
        display:none
      }

      .hero h1{
        max-width:100%;
        margin-inline:auto;
        font-size:clamp(22px,6.8vw,27px);
        line-height:1.08;
        letter-spacing:.035em;
        text-wrap:balance
      }

      .subtitle{
        margin-top:7px;
        font-size:clamp(10px,2.8vw,11px);
        letter-spacing:.065em;
        color:#e7d8b8
      }

      .brand-logo{
        width:58px;
        height:58px
      }

      .filters{
        position:static;
        padding:13px 12px 15px
      }

      .selects{
        grid-template-columns:1fr
      }

      .grid{
        padding:12px;
        grid-template-columns:1fr;
        gap:12px
      }

      .active{
        display:none
      }

      .chip{
        padding:8px 9px
      }

      .card{
        border-radius:9px
      }

      .visuals{
        grid-template-columns:1fr 1fr
      }
    }

    @media(max-width:480px){
      .hero{
        height:24svh;
        min-height:190px;
        max-height:215px;
        background-size:100% auto;
        background-position:center 18px
      }
    }

    @media(max-width:380px){
      .hero-inner{
        padding-bottom:25px
      }

      .hero h1{
        font-size:22px;
        letter-spacing:.025em
      }

      .subtitle{
        letter-spacing:.04em
      }
    }

    @media(max-height:500px) and (orientation:landscape){
      .hero{
        height:190px;
        min-height:190px;
        background-position:center 34%
      }

      .hero-inner{
        padding-top:calc(env(safe-area-inset-top) + 8px);
        padding-bottom:23px
      }
    }
      .research-actions{margin-top:14px;display:flex;justify-content:flex-end}
    .research-button,.research-dialog .card-button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border:1px solid #79613b;border-radius:6px;font:inherit;font-size:12px;background:#201a12;color:#d8c394;cursor:pointer}
    .research-button:disabled{opacity:.5;cursor:not-allowed}
    .research-button:focus-visible,.research-dialog button:focus-visible{outline:2px solid #e9c581;outline-offset:3px}
    .research-button{font-size:12px;padding:8px 11px;min-height:44px;background:transparent;color:#d8c394}
    .research-feedback{font-size:12px;line-height:1.6;color:#ead5ac;overflow-wrap:anywhere}
    .research-dialog{width:min(420px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:22px;border:1px solid #947543;border-radius:10px;background:#171511;color:#f1e4cc}
    .research-dialog::backdrop{background:rgba(0,0,0,.72)}
    .research-dialog h2{font-size:18px;margin:0 0 16px;color:#e4c78d}
    .research-dialog p{line-height:1.7;overflow-wrap:anywhere}
    .research-dialog .dialog-ref{font-size:12px;color:#d8c394;margin-bottom:6px}
    .research-dialog .dialog-name{font-size:16px;margin-top:0}
    .research-dialog .dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:20px}
    .research-dialog .confirm-research{background:#d5b477;color:#17120b}
</style>
</head>

<body>

<header id="hero" class="hero">
  <div class="hero-inner">
    <img id="logo" class="brand-logo" alt="">
    <div>
      <div class="eyebrow">MARIAGE FRÈRES · PARIS 1854</div>

    </div>
  </div>
</header>

<div class="filters">
  <div class="wrap">

    <div class="toprow">
      <input
        id="q"
        class="search"
        placeholder="T番号・銘柄名・説明文・香味タグから検索"

    <div class="selects">

      </select>

      <select id="origin">

    </div>

    <div class="section">

        香り・風味

    <div class="section">

      <div class="feature-chips">

        <label class="feature-chip">
          <input id="milk" type="checkbox">

        </label>

        <label class="feature-chip">
          <input id="iced" type="checkbox">

        </label>

        <label class="feature-chip">
          <input id="cold" type="checkbox">

        </label>

        <label class="feature-chip">

        <label class="feature-chip">

    <div class="section">

        <option value="shopping" selected>買い物</option>
        <option value="all">すべて</option>
        <option value="past">過去・終売</option>

      <p id="salesMigrationNotice" class="sales-migration-notice" hidden>掲載状況を確認中の銘柄も表示しています。</p>

<div id="status" class="status">
  銘柄データを読み込み中…

<main id="list" class="grid wrap"></main>

  <h2 id="researchDialogTitle">情報を補完</h2>
  <p id="researchDialogRef" class="dialog-ref"></p>
  <p id="researchDialogName" class="dialog-name"></p>
  <p id="researchDialogMessage">この銘柄の不足情報を調査キューへ送ります</p>
  <div class="dialog-actions">
    <button type="button" id="cancelResearch" class="card-button" autofocus>キャンセル</button>
    <button type="button" id="confirmResearch" class="card-button confirm-research">調査依頼する</button>
  </div>
</dialog>
<script id="complete-card-client">
(function(root){
  'use strict';
  function payload(row) {
    if(!row || typeof row.VersionKey!=='string' || !row.VersionKey.trim()) throw new Error('対象VersionKeyがありません。');
    return {action:'requestResearch',versionKey:row.VersionKey,primaryReference:String(row['Primary Reference']||''),
      teaReference:String(row['Tリファレンス番号']||''),displayName:String(row['現在の公式名']||row['銘柄名（黒い本）']||''),
      requestType:'complete_card',requestedAt:new Date().toISOString()};
  }
  function errorMessage(status,reason) {
    const messages={reference_mismatch:'REFが登録情報と一致しません。',invalid_version:'対象Versionが見つかりません。',
      conflict:'対象Versionまたは受付情報が一致しません。',disabled:'現在、調査依頼の受付は停止中です。',
      error:'調査依頼を登録できませんでした。時間をおいて再試行してください。',
      invalid_request_type:'調査依頼の種類が不正です。',schema_required:'受付の準備が整っていません。',busy:'受付が混み合っています。再試行してください。'};
    return messages[reason]||messages[status]||messages.error;
  }
  async function send(row,config,fetcher=fetch) {
    const body=payload(row);
    if(config.RESEARCH_API_ENABLED===false) throw new Error(errorMessage('disabled'));
    let endpoint;
    try{endpoint=new URL(config.GAS_API_URL);}catch(_){throw new Error('受付URLが設定されていません。');}
    if(endpoint.protocol!=='https:' && !(endpoint.protocol==='http:'&&['localhost','127.0.0.1'].includes(endpoint.hostname)))throw new Error('受付URLが不正です。');
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
    try{
      const response=await fetcher(endpoint.href,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(config.RESEARCH_DRY_RUN===true?{...body,dryRun:true}:body),signal:controller.signal});
      if(!response.ok)throw new Error('受付サーバーとの通信に失敗しました。');
      const result=await response.json();
      if(!result.ok || !['queued','already_queued','dry_run'].includes(result.status)){
        throw new Error(errorMessage(result.status,result.reason));
      }
      if(result.versionKey!==row.VersionKey)throw new Error('受付結果のVersionKeyが一致しません。');
      return result;
    }catch(e){if(e.name==='AbortError'||e.name==='TimeoutError'||e instanceof TypeError)throw new Error('通信に失敗しました。接続を確認して再試行してください。');if(e instanceof SyntaxError)throw new Error('受付結果を読み取れませんでした。再試行してください。');throw e;}
    finally{clearTimeout(timer);}
  }
  const api={payload,send,errorMessage};if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.MFResearchRequest=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script>

];

const FREE_TEXT_SEARCH_FIELDS=[
  'VersionKey',
  'Primary Reference',
  ...SALES_FORMAT_REFERENCE_FIELDS,
  '銘柄名（黒い本）',
  '日本語名（黒い本）',
  'カタカナ表記',
  '現在の公式名',
  '現在のカテゴリ',

const $=x=>document.getElementById(x);

const sp=s=>
  String(s||'')
    .split(/[、,;／|]/)
    .map(x=>x.trim())
    .filter(Boolean);

const n=s=>
  String(s||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/\s+/g,'');

const yes=s=>
  ['はい','yes','true','1','推奨'].includes(n(s));

const esc=s=>
  String(s||'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

const uniq=a=>
  [...new Set(a.filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'ja'));


function salesFormatCodes(row){
  return uniq(
    [
      ...SALES_FORMAT_REFERENCE_FIELDS
        .flatMap(key=>
          sp(row[key])
        ),
      displayReference(row)
    ]
      .map(x=>
        String(x||'').trim().toUpperCase()
      )
      .map(ref=>{
        const m=ref.match(/^(TFBF|TFG|TJC|TB|TC|TE|TF|TP|TJ|TA|T)/);
        return m ? m[1] : '';
      })
      .filter(Boolean)
  );
}

function salesFormatIconPath(code){
  return (
    SALES_FORMAT_ICON_BASE+
    'format-'+
    String(code||'').toLowerCase()+
    '.png'
  );
}

function displayReference(row){
  const primaryRef=String(row['Primary Reference']||'').trim();
  if(primaryRef){
    return primaryRef;
  }

  const teaRef=String(row['Tリファレンス番号']||'').trim();
  if(teaRef){
    return teaRef;
  }

  const salesRef=SALES_FORMAT_REFERENCE_FIELDS
    .flatMap(key=>sp(row[key]))
    .map(x=>String(x||'').trim().toUpperCase())
    .find(Boolean);
  if(salesRef){
    return salesRef;
  }

  const versionKey=String(row['VersionKey']||'').trim();
  const m=versionKey.match(/^([A-Z]+\d[A-Z0-9]*)-B\d{2}$/i);
  return m ? m[1].toUpperCase() : versionKey;
}


function renderSalesFormatIcons(row){
  const codes=salesFormatCodes(row);

  if(!codes.length){
    return '';
  }

  return `
    <div class="sales-format-icons">
      ${
        codes.map(code=>`
          <img
            class="sales-format-icon"
            loading="lazy"
            src="${esc(salesFormatIconPath(code))}"
            alt="${esc('販売形態 '+code)}"
            title="${esc(code)}"
            onerror="this.hidden=true"
          >
        `).join('')
      }
    </div>
  `;
}


function fill(id,a){

function normalizeTeaType(value){
  const raw=String(value||'').trim();
  const v=n(raw);

  if(raw==='紅茶'){
    return '黒茶';
  }

  if(
    v.includes('ティザン') ||
    v.includes('チザン') ||
    v.includes('tisane') ||
    v.includes('fruittea') ||
    v.includes('フルーツティー') ||
    v.includes('ハーブティー') ||
    v==='ハーブ'
  ){
    return 'ティザン';
  }

  if(
    v.includes('マテ') ||
    v.includes('mate') ||
    v.includes('maté')
  ){
    return 'マテ';
  }

  return raw;
}


function fillTeaTypes(){
  const e=$('tea');

  const values=new Set(
    R.flatMap(r=>
      sp(r['茶種タグ'])
    )
    .map(normalizeTeaType)
    .filter(Boolean)
  );

  TEA_TYPE_ORDER.forEach(x=>{
    e.add(new Option(x,x));
    values.delete(x);
  });

  [...values]
    .sort((a,b)=>a.localeCompare(b,'ja'))
    .forEach(x=>
      e.add(new Option(x,x))
    );
}


function hasAll(value,set){
  const vals=sp(value);

  return [...set].every(x=>
    vals.includes(x)
  );
}


function driveId(url){
  const s=String(url||'');

  let m=s.match(/\/d\/([A-Za-z0-9_-]{20,})/);
  if(m)return m[1];

  m=s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
  if(m)return m[1];

  if(/^[A-Za-z0-9_-]{20,}$/.test(s)){
    return s;
  }

  return '';
}


function imageUrl(value){
  if(!value)return '';

  const id=driveId(value);

  return id
    ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1200`
    : value;
}

function matchesTime(value,selected){
  if(!selected){
    return true;
  }

  const v=n(value);

  if(v.includes('終日')){
    return true;
  }

  if(selected==='朝'){
    return (
      v.includes('朝') ||
      v.includes('朝食') ||
      v.includes('ブランチ')
    );
  }

  if(selected==='昼'){
    return (
      v.includes('昼') ||
      v.includes('昼食') ||
      v.includes('ブランチ')
    );
  }

  if(selected==='午後'){
    return (
      v.includes('午後') ||
      v.includes('お茶の時間')
    );
  }

  if(selected==='夜'){
    return (
      v.includes('夜') ||
      v.includes('夕食')
    );
  }

  return false;
}

function matches(r){
  if (!MFSalesState.matchesScope(r, $('displayScope').value, salesMigrationComplete)) return false;
  const q=n(
    $('q').value
  );

  if(
    q &&
    !n(
      FREE_TEXT_SEARCH_FIELDS
        .map(field=>r[field])
        .join(' ')
    ).includes(q)
  ){
    return false;
  }

  if($('tea').value){
    const teaTypes=
      sp(r['茶種タグ'])
        .map(normalizeTeaType);

    if(
      !teaTypes.includes(
        $('tea').value
      )
    ){
      return false;
    }
  }

  if($('origin').value){

    const origin=
      $('origin').value;

    if(
      MAJOR_REGIONS.includes(origin)
    ){

      if(
        !n(
          r['産地・地域／茶園']
        ).includes(
          n(origin)
        )
      ){
        return false;
      }

    }else{

      if(
        !sp(
          r['産地・国']
        ).includes(origin)
      ){
        return false;
      }

    }

  }

  if(
    !matchesTime(
      r['時間帯タグ'],
      timeSel
    )
  ){
    return false;
  }

  if(
    aromaSel.size &&
    !hasAll(
      r['香味大分類'],
      aromaSel
    )
  ){
    return false;
  }

  if(
    detailSel.size &&
    !hasAll(
      r['香味詳細タグ'],
      detailSel
    )
  ){
    return false;
  }

  if(
    $('milk').checked &&
    !yes(
      r['ミルクティー推奨']
    )
  ){
    return false;
  }

  if(
    $('smoke').checked &&
    !yes(
      r['燻製茶']
    )
  ){
    return false;
  }

  if(
    $('cold').checked &&
    !yes(
      r['水出し用ブレンド']
    )
  ){
    return false;
  }

  if(
    $('iced').checked &&
    !yes(
      r['アイスティー推奨']
    )
  ){
    return false;
  }

  if(
    $('theine').checked &&
    !yes(
      r['テインフリー']
    )
  ){
    return false;
  }

  return true;
}


function activeText(){
  const a=['表示範囲:'+({shopping:'買い物',all:'すべて',past:'過去・終売'}[$('displayScope').value]||'買い物')];

    a.push('ミルク');
  }

  if($('smoke').checked){
    a.push('燻製');
  }

  if($('cold').checked){
    a.push('水出し');
  }

function refreshResearchButtons(){
  document.querySelectorAll('.research-button').forEach(button=>{
    const state=researchStates.get(button.dataset.versionKey);
    if(!state)return;
    button.disabled=state.kind==='pending'||state.kind==='done'||!button.dataset.versionKey||R.filter(row=>row.VersionKey===button.dataset.versionKey).length!==1;
    button.textContent=state.kind==='pending'?'受付中…':state.kind==='done'?'✓ 調査依頼済み':state.kind==='dry_run'?'検証済み（未送信）':'再試行する';
    let message=button.closest('.body').querySelector('.research-feedback');
    if(!message){message=document.createElement('p');message.className='research-feedback';message.setAttribute('role','status');button.parentElement.before(message);}
    message.setAttribute('role',state.kind==='error'?'alert':'status');
    message.textContent=state.message||'';
  });
}

function loadJsonp(){

  return new Promise(
    (resolve,reject)=>{

      const base=
        String(
          C.GAS_API_URL||''
        ).trim();

      if(
        !/^https:\/\//.test(base) ||
        base.includes('PASTE_YOUR')
      ){

        return reject(
          new Error(
            'app-config.js に GAS_API_URL を設定してください。'
          )
        );

      }

      const cb=
        '__mfTeaCb_'+Date.now();

      const s=
        document.createElement('script');

      const timer=
        setTimeout(()=>{

          cleanup();

          reject(
            new Error(
              'データ取得がタイムアウトしました。'
            )
          );

        },20000);


      function cleanup(){

        clearTimeout(timer);

        delete window[cb];

        s.remove();

      }


      window[cb]=data=>{

        cleanup();

        resolve(data);

      };


      s.onerror=()=>{

        cleanup();

        reject(
          new Error(
            'GAS APIを読み込めませんでした。'
          )
        );

      };


      s.src=
        base+
        (
          base.includes('?')
            ? '&'
            : '?'
        )+
        'action=teaData&callback='+
        encodeURIComponent(cb)+
        '&_='+
        Date.now();


      document.head.appendChild(s);

    }
  );

}

$('list').addEventListener('click',event=>{
  const button=event.target.closest('.research-button');
  if(!button || button.disabled || researchConfirmation) return;
  const candidates=R.filter(row=>row.VersionKey===button.dataset.versionKey);
  if(candidates.length!==1 || !button.dataset.versionKey) return;
  const key=button.dataset.versionKey;
  if(['pending','done'].includes(researchStates.get(key)?.kind))return;
  // Snapshot the Master row, never reconstruct references or names from card text.
  researchConfirmation={row:{...candidates[0]},button};
  const row=researchConfirmation.row;
  $('researchDialogRef').textContent='REF：'+String(row['Tリファレンス番号']||row['Primary Reference']||'');
  $('researchDialogName').textContent=String(row['現在の公式名']||row['銘柄名（黒い本）']||'');
  $('researchDialog').showModal();
});
$('cancelResearch').addEventListener('click',()=>$('researchDialog').close());
$('researchDialog').addEventListener('close',()=>{if(!$('researchDialog').open)researchConfirmation=null;});
$('confirmResearch').addEventListener('click',async()=>{
  const confirmation=researchConfirmation;
  if(!confirmation)return;
  researchConfirmation=null; // Block repeated confirm clicks before starting any async work.
  const {row}=confirmation,key=row.VersionKey;
  $('researchDialog').close();
  const candidates=R.filter(item=>item.VersionKey===key);
  if(candidates.length!==1 || ['VersionKey','Primary Reference','Tリファレンス番号','現在の公式名','銘柄名（黒い本）'].some(field=>candidates[0][field]!==row[field])){
    researchStates.set(key,{kind:'error',message:'表示データが更新されました。カードを確認して再試行してください。'});
    refreshResearchButtons();return;
  }
  if(['pending','done'].includes(researchStates.get(key)?.kind))return;
  researchStates.set(key,{kind:'pending'});refreshResearchButtons();
  try{
    const result=await MFResearchRequest.send(row,C);
    const message=result.status==='queued'?'調査依頼を登録しました':result.status==='already_queued'?'この銘柄はすでに調査待ちです':'受付内容を検証しました。キューには書き込んでいません。';
    researchStates.set(key,{kind:result.status==='dry_run'?'dry_run':'done',message});
  }catch(error){researchStates.set(key,{kind:'error',message:error.message});}
  refreshResearchButtons();
});

$('reset').addEventListener(
  'click',
  reset
);


applyBrand();


loadJsonp()
  .then(initData)
  .catch(err=>{

    $('status').textContent=
      err.message;

    $('status').classList.add(
      'error'
    );

    $('list').innerHTML=
      '<div class="empty">設定を確認してください。</div>';

  });


if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    ()=>{

      navigator.serviceWorker
        .register('./service-worker.js')
        .catch(()=>{});

    }
  );

}
</script>

</body>
</html>
